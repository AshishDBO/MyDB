            background-color: white;

            border-radius: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .error-message {

        }

            padding: 0.5rem 1.25rem;

            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            background-color: white;

        .day-button:hover {
            background-color: #edf2f7;
        }
        .day-button.selected {
            background-color: #4fd1c5;
            color: white;

        }
        .dashboard-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #edf2f7;
        }
        .dashboard-section:last-child {
            border-bottom: none;
        }
        .dashboard-section h3 {
            color: #2d3748;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        .dashboard-section h3::before {
            content: '•';
            color: #4fd1c5;
            margin-right: 0.5rem;
            font-size: 1.5rem;
        }
        .nav-container {
            background: linear-gradient(to right, #4fd1c5, #4299e1);
        }
        .btn-primary {
            background-color: #4fd1c5;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #38b2ac;
        }
        input, select {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.75rem;
            width: 100%;
            transition: border-color 0.2s ease;
        }

        const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

        function Navbar() {
            return (
                <nav className="nav-container p-4">
                    <div className="container mx-auto flex justify-between items-center">
                        <h1 className="text-white text-2xl font-semibold">Digital Benchers</h1>
                        <div className="space-x-6">
                            <a href="#" className="text-white hover:text-gray-200 transition">Home</a>
                            <a href="#" className="text-white hover:text-gray-200 transition">About</a>
                            <a href="#" className="text-white hover:text-gray-200 transition">Contact</a>
                        </div>
                    </div>
                </nav>
            );
        }

        function Dashboard({ formData }) {
            const calculateDaysLeft = (examDate) => {
                if (!examDate) return "N/A";
                const today = new Date();
                const target = new Date(examDate);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays > 0 ? `${diffDays} days` : "Passed";
            };

            const generateStudyPlan = () => {
                let plan = `Your personalized study plan is designed to help you achieve ${formData.desiredPercentage} in your 12th CBSE exams and prepare for your career in ${formData.careerField}. `;
                plan += `You’ll study ${formData.studyHours} hours per day on ${formData.studyDays.join(", ")}. `;
                plan += `With ${calculateDaysLeft(formData.examDate)} left until your exam, focus on: `;
                plan += `- Core subjects related to ${formData.stream}. `;
                plan += `- Practice exams like ${careerData.find(item => item.branch === formData.careerField)?.exams || "relevant tests"}. `;
                if (formData.motivation === "1-5") {
                    plan += `- Build momentum with short, focused study sessions.`;
                } else if (formData.motivation === "6-8") {
                    plan += `- Maintain consistency with a weekly schedule.`;
                } else {
                    plan += `- Leverage your drive with advanced problem-solving.`;
                }
                if (formData.distraction !== "Nothing") {
                    plan += ` To tackle ${formData.distraction.toLowerCase()}, use strategies like app blockers or focused group study.`;
                }
                return plan;
            };

            return (
                <div className="dashboard-container">
                    <h2 className="text-2xl font-semibold text-gray-800 mb-6">Your Study Dashboard, {formData.name}</h2>
                    <div className="dashboard-section">
                        <h3>Personal Details</h3>
                        <p className="text-gray-600"><strong>Name:</strong> {formData.name}</p>
                        <p className="text-gray-600"><strong>Gender:</strong> {formData.gender}</p>
                        <p className="text-gray-600"><strong>Location:</strong> {formData.country}{formData.state ? `, ${formData.state}` : ""}</p>
                        <p className="text-gray-600"><strong>Category:</strong> {formData.category}</p>
                        <p className="text-gray-600"><strong>Date of Birth:</strong> {formData.dob || "N/A"}</p>
                    </div>
                    <div className="dashboard-section">
                        <h3>Academic Profile</h3>
                        <p className="text-gray-600"><strong>Current Class:</strong> {formData.currentClass}</p>
                        <p className="text-gray-600"><strong>Class 10th Passing Year:</strong> {formData.yearOfPassing}</p>
                        <p className="text-gray-600"><strong>Stream:</strong> {formData.stream}</p>
                        <p className="text-gray-600"><strong>Career Path:</strong> {formData.careerField} ({formData.careerOption})</p>
                        <p className="text-gray-600"><strong>Desired 12th Percentage:</strong> {formData.desiredPercentage}</p>
                    </div>
                    <div className="dashboard-section">
                        <h3>Study Preferences</h3>
                        <p className="text-gray-600"><strong>Motivation Level:</strong> {formData.motivation} (1-10)</p>
                        <p className="text-gray-600"><strong>Main Distraction:</strong> {formData.distraction}</p>
                        <p className="text-gray-600"><strong>Daily Study Hours:</strong> {formData.studyHours}</p>
                        <p className="text-gray-600"><strong>Exam Date:</strong> {formData.examDate || "N/A"} ({calculateDaysLeft(formData.examDate)} left)</p>
                        <p className="text-gray-600"><strong>Study Days:</strong> {formData.studyDays.join(", ")}</p>
                    </div>
                    <div className="dashboard-section">
                        <h3>Your Personalized Study Plan</h3>
                        <p className="text-gray-600">{generateStudyPlan()}</p>
                    </div>
                </div>
            );
        }

        function StudyPlannerForm({ onSubmit }) {
            const [formData, setFormData] = React.useState({
                name: '',
                gender: '',
                country: '',
                state: '',
                category: '',
                dob: '',
                currentClass: '',
                yearOfPassing: '',
                stream: '',
                careerAwareness: '',
                careerOption: '',
                careerProcess: '',
                careerField: '',
                careerGoal: '',
                desiredPercentage: '',
                motivation: '',
                distraction: '',
                studyHours: '',
                examDate: '',
                studyDays: []
            });
            const [step, setStep] = React.useState(0);
            const [personalizedMessage, setPersonalizedMessage] = React.useState('');
            const [error, setError] = React.useState('');

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                setError('');
            };

            const handleDayToggle = (day) => {
                setFormData(prev => {
                    const studyDays = prev.studyDays.includes(day)
                        ? prev.studyDays.filter(d => d !== day)
                        : [...prev.studyDays, day];
                    return { ...prev, studyDays };
                });
                setError('');
            };

            const validateStep = () => {
                switch (step) {
                    case 1: return formData.name.trim() !== '';
                    case 2: return formData.gender !== '';
                    case 3: return formData.country !== '';
                    case 4: return formData.country !== 'India' || formData.state !== '';
                    case 5: return formData.category !== '';
                    case 6: return formData.dob !== '';
                    case 7: return formData.currentClass !== '';
                    case 8: return formData.yearOfPassing !== '';
                    case 9: return formData.stream !== '';
                    case 10: return formData.careerAwareness !== '';
                    case 11: return formData.careerOption !== '';
                    case 12: return formData.careerProcess !== '';
                    case 13: return formData.careerField !== '';
                    case 14: return formData.careerGoal !== '';
                    case 15: return formData.desiredPercentage !== '';
                    case 16: return formData.motivation !== '';
                    case 17: return formData.distraction !== '';
                    case 18: return formData.studyHours !== '';
                    case 19: return formData.examDate !== '';
                    case 20: return formData.studyDays.length > 0;
                    default: return true;
                }
            };

            const handleNext = () => {
                if (!validateStep()) {
                    setError('Please fill in this field before proceeding.');
                    return;
                }

                let message = '';
                switch (step) {
                    case 0:
                        message = "Let’s craft a study plan tailored just for you! Ready to kickstart your journey?";
                        break;
                    case 1:
                        message = `Hi ${formData.name}! Excited to help you chase your dreams—let’s keep going!`;
                        break;
                    case 2:
                        message = `Thanks for sharing, ${formData.name}. We’re building something special for you!`;
                        break;
                    case 3:
                        message = formData.country === 'India'
                            ? "Great to know you’re in India! We’ll tailor your plan with local exams and resources in mind."
                            : "Awesome, you’re outside India! We’ll customize your plan for global opportunities.";
                        break;
                    case 4:
                        message = formData.country === 'India'
                            ? `Nice to connect with you in ${formData.state}! This helps us personalize your journey further.`
                            : "Got it! We’ll ensure your plan fits your international context perfectly.";
                        break;
                    case 5:
                        message = {
                            'General': `Thanks for the info, ${formData.name}. Let’s shape your path to success!`,
                            'EWS/OBC (NCL)': `You’re set to shine, ${formData.name}! We’ll support you all the way.`,
                            'SC/ST': `We’re here for you, ${formData.name}. Let’s make your goals happen!`,
                            'Third Gender': `Your journey matters, ${formData.name}. Excited to guide you forward!`,
                            'PWD': `You’ve got this, ${formData.name}! We’ll provide tailored support for your success.`
                        }[formData.category];
                        break;
                    case 6:
                        message = "Your DOB helps us align your plan with your academic timeline. Onward we go!";
                        break;
                    case 7:
                        message = formData.currentClass === '11th Class'
                            ? "Class 11 is a great time to start strong! We’ll guide you to build a solid foundation."
                            : "Class 12 is a big year! We’ll help you stay focused and ace your exams.";
                        break;
                    case 8:
                        message = "Thanks for sharing your Class 10th year. This helps us customize your next steps!";
                        break;
                    case 9:
                        message = {
                            'Science (PCM)': "PCM opens doors to engineering, tech, and more. Let’s explore your options!",
                            'Science (PCB)': "PCB is perfect for medical and life sciences. We’ll guide you to your dream career!",
                            'Commerce': "Commerce unlocks business and finance paths. Ready to dive in?",
                            'Agriculture': "Agriculture is a vibrant field! We’ll help you grow your future.",
                            'Humanities / Arts': "Humanities offers endless possibilities. Let’s find your passion!"
                        }[formData.stream];
                        break;
                    case 10:
                        message = formData.careerAwareness === 'Yes'
                            ? "Awesome, you’ve got career ideas! Let’s refine them together."
                            : "No stress! We’ll introduce you to exciting career paths for your stream.";
                        break;
                    case 11:
                        message = `${formData.careerOption} sounds exciting! Let’s see how to make it yours.`;
                        break;
                    case 12:
                        message = `The ${formData.careerProcess} path is clear. Let’s pick your specialization!`;
                        break;
                    case 13:
                        const selectedCareer = careerData.find(item => 
                            item.stream === formData.stream && 
                            item.careerOption === formData.careerOption && 
                            item.process === formData.careerProcess && 
                            item.branch === formData.careerField
                        );
                        message = selectedCareer
                            ? `${formData.careerField} is a fantastic choice! Prep for ${selectedCareer.exams} and aim for ${selectedCareer.careerPaths}. Ready to lock it in?`
                            : `${formData.careerField} is a great pick! Let’s finalize your focus.`;
                        break;
                    case 14:
                        message = formData.careerGoal === 'Yes, Go Ahead'
                            ? `Let’s dive into CBSE prep for ${formData.careerField}! You’re on the right track.`
                            : "No worries! Let’s explore other streams to find your perfect fit.";
                        break;
                    case 15:
                        message = {
                            '60-80%': `Solid goal, ${formData.name}! We’ll help you hit that mark with confidence.`,
                            '81-90%': `Aiming high—love it! Let’s push for that 90% together.`,
                            '91-100%': `Wow, ${formData.name}, you’re all in! We’ll help you ace that 90%+ goal!`
                        }[formData.desiredPercentage];
                        break;
                    case 16:
                        message = {
                            '1-5': "It’s okay to start small. Let’s boost your motivation step by step!",
                            '6-8': "You’re in a great spot! We’ll keep that momentum going strong.",
                            '9-10': "Your drive is inspiring! Let’s channel it into big wins."
                        }[formData.motivation];
                        break;
                    case 17:
                        message = {
                            'Phone / Social Media': "Phones can be tricky! Try app blockers and reward yourself after studying.",
                            'Friends': "Friends are great, but focus comes first. Group study could help!",
                            'Laziness': "We all feel lazy sometimes. Start with small tasks to build momentum!",
                            'Nothing': "That’s amazing focus! Let’s keep it sharp with healthy habits."
                        }[formData.distraction];
                        break;
                    case 18:
                        message = `${formData.studyHours} hours daily? That’s a strong commitment—let’s make it count!`;
                        break;
                    case 19:
                        message = "Your exam date is set! Every day brings you closer to crushing it.";
                        break;
                    case 20:
                        message = "Love your study schedule! Consistency will lead you to success.";
                        break;
                }
                setPersonalizedMessage(message);
                if (step === 14 && formData.careerGoal === 'No, Want to Explore Other Streams Also') {
                    setFormData(prev => ({
                        ...prev,
                        stream: '',
                        careerAwareness: '',
                        careerOption: '',
                        careerProcess: '',
                        careerField: '',
                        careerGoal: ''
                    }));
                    setStep(9);
                } else {
                    setStep(prev => prev + 1);
                }
            };

            const handleSubmit = () => {
                if (!validateStep()) {
                    setError('Please fill in this field before proceeding.');
                    return;
                }
                onSubmit(formData);
            };

            const renderFormStep = () => {
                switch (step) {
                    case 0:
                        return (
                            <div className="text-center">
                                <h3 className="text-xl font-semibold text-gray-800 mb-6">Ready to Build Your Perfect Study Plan?</h3>
                                <button onClick={handleNext} className="btn-primary">Let’s Get Started!</button>
                            </div>
                        );
                    case 1:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What’s your full name?</label>
                                <input type="text" name="name" value={formData.name} onChange={handleChange} />
                                {error && <p className="error-message">{error}</p>}
                                {formData.name.trim() && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 2:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What’s your gender?</label>
                                <select name="gender" value={formData.gender} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.gender && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 3:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Where do you live?</label>
                                <select name="country" value={formData.country} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="India">India</option>
                                    <option value="Outside India">Outside India</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.country && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 4:
                        if (formData.country === 'India') {
                            return (
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Which State/UT are you from?</label>
                                    <select name="state" value={formData.state} onChange={handleChange}>
                                        <option value="">Select</option>
                                        {statesUTs.map(state => (
                                            <option key={state} value={state}>{state}</option>
                                        ))}
                                    </select>
                                    {error && <p className="error-message">{error}</p>}
                                    {formData.state && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                                </div>
                            );
                        }
                        return (
                            <div>
                                <p className="text-gray-600 mb-6">We’ll customize your plan for international opportunities.</p>
                                <button onClick={handleNext} className="btn-primary w-full">Next</button>
                            </div>
                        );
                    case 5:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Which category do you belong to?</label>
                                <select name="category" value={formData.category} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="General">General</option>
                                    <option value="EWS/OBC (NCL)">EWS/OBC (NCL)</option>
                                    <option value="SC/ST">SC/ST</option>
                                    <option value="Third Gender">Third Gender</option>
                                    <option value="PWD">PWD</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.category && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 6:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What’s your date of birth?</label>
                                <input type="date" name="dob" value={formData.dob} onChange={handleChange} />
                                {error && <p className="error-message">{error}</p>}
                                {formData.dob && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 7:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What’s your current class?</label>
                                <select name="currentClass" value={formData.currentClass} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="11th Class">11th Class</option>
                                    <option value="12th Class">12th Class</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.currentClass && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 8:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">When did/will you pass Class 10th?</label>
                                <select name="yearOfPassing" value={formData.yearOfPassing} onChange={handleChange}>
                                    <option value="">Select</option>
                                    {years.map(year => (
                                        <option key={year} value={year}>{year}</option>
                                    ))}
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.yearOfPassing && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 9:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Which stream are you pursuing?</label>
                                <select name="stream" value={formData.stream} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="Science (PCM)">Science (PCM)</option>
                                    <option value="Science (PCB)">Science (PCB)</option>
                                    <option value="Commerce">Commerce</option>
                                    <option value="Agriculture">Agriculture</option>
                                    <option value="Humanities / Arts">Humanities / Arts</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.stream && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 10:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Do you know specific career options in your {formData.stream} stream?</label>
                                <select name="careerAwareness" value={formData.careerAwareness} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.careerAwareness && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 11:
                        const careerOptions = [...new Set(careerData
                            .filter(item => item.stream === formData.stream)
                            .map(item => item.careerOption))];
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Which career option interests you?</label>
                                <select name="careerOption" value={formData.careerOption} onChange={handleChange}>
                                    <option value="">Select</option>
                                    {careerOptions.map(option => (
                                        <option key={option} value={option}>{option}</option>
                                    ))}
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.careerOption && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 12:
                        const careerProcesses = [...new Set(careerData
                            .filter(item => item.stream === formData.stream && item.careerOption === formData.careerOption)
                            .map(item => item.process))];
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What’s the process for {formData.careerOption}?</label>
                                <select name="careerProcess" value={formData.careerProcess} onChange={handleChange}>
                                    <option value="">Select</option>
                                    {careerProcesses.map(process => (
                                        <option key={process} value={process}>{process}</option>
                                    ))}
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.careerProcess && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 13:
                        const careerFields = [...new Set(careerData
                            .filter(item => item.stream === formData.stream && item.careerOption === formData.careerOption && item.process === formData.careerProcess)
                            .map(item => item.branch))];
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Which field interests you in {formData.careerOption}?</label>
                                <select name="careerField" value={formData.careerField} onChange={handleChange}>
                                    <option value="">Select</option>
                                    {careerFields.map(field => (
                                        <option key={field} value={field}>{field}</option>
                                    ))}
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.careerField && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 14:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Ready to focus on 12th CBSE prep for {formData.careerField}?</label>
                                <select name="careerGoal" value={formData.careerGoal} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="Yes, Go Ahead">Yes, Go Ahead</option>
                                    <option value="No, Want to Explore Other Streams Also">No, Explore Other Streams</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.careerGoal && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 15:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What’s your desired 12th percentage?</label>
                                <select name="desiredPercentage" value={formData.desiredPercentage} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="60-80%">60-80%</option>
                                    <option value="81-90%">81-90%</option>
                                    <option value="91-100%">91-100%</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.desiredPercentage && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 16:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">How motivated are you to study? (1-10)</label>
                                <select name="motivation" value={formData.motivation} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="1-5">1-5</option>
                                    <option value="6-8">6-8</option>
                                    <option value="9-10">9-10</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.motivation && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 17:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What distracts you most while studying?</label>
                                <select name="distraction" value={formData.distraction} onChange={handleChange}>
                                    <option value="">Select</option>
                                    <option value="Phone / Social Media">Phone / Social Media</option>
                                    <option value="Friends">Friends</option>
                                    <option value="Laziness">Laziness</option>
                                    <option value="Nothing">Nothing</option>
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.distraction && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 18:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">How many hours will you study daily?</label>
                                <select name="studyHours" value={formData.studyHours} onChange={handleChange}>
                                    <option value="">Select</option>
                                    {hours.map(hour => (
                                        <option key={hour} value={hour}>{hour}</option>
                                    ))}
                                </select>
                                {error && <p className="error-message">{error}</p>}
                                {formData.studyHours && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 19:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">What’s your target exam date?</label>
                                <input type="date" name="examDate" value={formData.examDate} onChange={handleChange} />
                                {error && <p className="error-message">{error}</p>}
                                {formData.examDate && <button onClick={handleNext} className="mt-6 btn-primary w-full">Next</button>}
                            </div>
                        );
                    case 20:
                        return (
                            <div>
                                <label className="block text-gray-700 font-medium mb-2">Which days will you study?</label>
                                <div className="flex flex-wrap">
                                    {daysOfWeek.map(day => (
                                        <button
                                            key={day}
                                            className={`day-button ${formData.studyDays.includes(day) ? 'selected' : ''}`}
                                            onClick={() => handleDayToggle(day)}
                                        >
                                            {day}
                                        </button>
                                    ))}
                                </div>
                                {error && <p className="error-message">{error}</p>}
                                {formData.studyDays.length > 0 && <button onClick={handleSubmit} className="mt-6 btn-primary w-full">Finish</button>}
                            </div>
                        );
                    default:
                        return null;
                }
            };

            return (
                <div className="form-container">
                    {renderFormStep()}
                    {personalizedMessage && step > 0 && <p className="prompt-message">{personalizedMessage}</p>}
                </div>
            );
        }

        function App() {
            const [showForm, setShowForm] = React.useState(true);
            const [formData, setFormData] = React.useState(null);

            const handleFormSubmit = (data) => {
                setFormData(data);
                setShowForm(false);
            };

            return (
                <div>
                    <Navbar />
                    <div className="container mx-auto py-10">
                        <h2 className="text-3xl font-semibold text-gray-800 mb-8 text-center">AI Study Planner</h2>
                        {showForm ? (
                            <StudyPlannerForm onSubmit={handleFormSubmit} />
                        ) : (
                            <Dashboard formData={formData} />
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
